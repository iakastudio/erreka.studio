<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Lucas Valerdi — Photographer Basque Country</title>
  <meta name="description" content="Contact Lucas Valerdi photographer in the Basque Country — surf shoots Biarritz, portrait Hendaye, editorial, signed prints. Based in the Basque Country, available worldwide." />

  <!-- Open Graph -->
  <meta property="og:title" content="Contact — Lucas Valerdi — Photographer Basque Country" />
  <meta property="og:description" content="A photo project in the Basque Country? Surf shoots, portrait, editorial or signed prints." />
  <meta property="og:image" content="https://erreka.studio/images/hero.jpg" />
  <meta property="og:url" content="https://erreka.studio/contact.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Karla:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">erreka</a>
    <button class="nav-toggle" aria-label="Menu" onclick="toggleMenu()">
      <span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="portfolio.html">portfolio</a></li>
      <li><a href="shop.html">shop</a></li>
      <li><a href="about.html">about</a></li>
      <li><a href="contact.html" class="active">contact</a></li>
    </ul>
  </nav>

  <div class="contact-wrap">

    <div class="contact-info">
      <p>
        A project in mind?<br />
        A wave not to miss?<br />
        Let's talk.
      </p>
      <a href="mailto:contact@erreka.studio">contact@erreka.studio</a>
      <a href="https://instagram.com/erreka_studio" target="_blank" rel="noopener noreferrer" aria-label="Instagram erreka_studio (new window)">@erreka_studio</a>
      <br />
      <p style="font-size: 0.75rem; color: var(--stone); margin-top: 1.5rem; line-height: 1.6;">
        Based in the Basque Country.<br />
        Available for projects in France and internationally.
      </p>
    </div>

    <form id="contact-form">

      <div class="field">
        <label for="name">name</label>
        <input type="text" id="name" name="name" required autocomplete="name" />
      </div>

      <div class="field">
        <label for="email">email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>

      <div class="field">
        <label for="type">project type</label>
        <select id="type" name="type">
          <option value="">—</option>
          <option value="shoot">shoot</option>
          <option value="print">print</option>
          <option value="other">other</option>
        </select>
      </div>

      <div class="field">
        <label for="message">message</label>
        <textarea id="message" name="message" required placeholder="Describe your project, dates, questions..."></textarea>
      </div>

      <button type="submit">send</button>

    </form>

  </div>

  <footer>
    <p>© 2025 Lucas Valerdi — erreka.studio</p>
    <a href="https://instagram.com/erreka_studio" target="_blank" rel="noopener noreferrer" aria-label="Instagram erreka_studio (nouvelle fenêtre)">instagram</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
